name: CareerSprint - validate and deploy Azure Static Web App

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: careersprint-swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for plan validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate schedule and static app configuration
        run: node validate.mjs

      - name: Check JavaScript syntax
        run: node --check web/app.js

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Functions dependencies
        run: dotnet restore api/CareerSprint.Api.csproj

      - name: Run API, authentication, persistence, and concurrency tests
        run: dotnet test api.Tests/CareerSprint.Api.Tests.csproj --configuration Release

      - name: Compile Azure Functions API
        run: dotnet build api/CareerSprint.Api.csproj --configuration Release --no-restore

      - name: Deploy frontend and API to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          api_location: api
          output_location: ''
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close Azure Static Web Apps preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
